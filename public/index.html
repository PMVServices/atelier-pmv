<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1B4F8A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Atelier PMV" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="%PUBLIC_URL%/logo152.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="%PUBLIC_URL%/logo192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="%PUBLIC_URL%/logo512.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Atelier PMV — Fiches d'entretien</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { overscroll-behavior-y: contain; }
      body { font-family: system-ui, -apple-system, sans-serif; background: #F5F6F8; }
      input, select, button { font-family: inherit; }

      /* Cibles tactiles agrandies : uniquement sur écran tactile (tablette/mobile), jamais sur PC/souris */
      @media (pointer: coarse) {
        button, input, select, textarea { min-height: 44px; font-size: 16px !important; }
        button { padding: 12px 20px !important; }
        input, select, textarea { padding: 11px 12px !important; }
        input[type="checkbox"], input[type="radio"] { min-height: 0; width: 22px; height: 22px; }
      }
    </style>
  </head>
  <body>
    <noscript>Vous devez activer JavaScript pour utiliser cette application.</noscript>
    <div id="root"></div>
    <script>
      // Verrouille l'orientation en portrait quand le navigateur le permet (en plus du
      // verrou déclaré dans manifest.json, qui est la méthode principale pour une PWA
      // installée). Échoue silencieusement si l'API n'est pas disponible ou refuse
      // (hors plein écran par exemple) : ce n'est qu'un filet de sécurité.
      (function () {
        function verrouiller() {
          try {
            if (window.screen && window.screen.orientation && window.screen.orientation.lock) {
              window.screen.orientation.lock("portrait").catch(function () {});
            }
          } catch (e) {}
        }
        verrouiller();
        document.addEventListener("visibilitychange", function () {
          if (!document.hidden) verrouiller();
        });
      })();
    </script>
    <script>
      // Bug connu sur certaines tablettes Android (PWA installée en mode "standalone") :
      // après une rotation, la page reste affichée à l'échelle de l'ancienne orientation,
      // minuscule et collée en haut à gauche, tant qu'on ne force pas un vrai recalcul.
      // orientationchange se déclenche souvent AVANT que innerWidth/innerHeight n'aient la
      // bonne valeur, donc on réessaie plusieurs fois avec un délai.
      (function () {
        var vp = document.querySelector('meta[name="viewport"]');
        if (!vp) return;
        var base = vp.getAttribute('content');
        var busy = false;
        function reflow() {
          var s = document.documentElement.style;
          s.display = "none";
          void document.documentElement.offsetHeight;
          s.display = "";
          vp.setAttribute("content", base + ", shrink-to-fit=no");
          requestAnimationFrame(function () {
            vp.setAttribute("content", base);
            window.dispatchEvent(new Event("resize"));
          });
        }
        function onRotate() {
          if (busy) return;
          busy = true;
          [50, 200, 500, 900].forEach(function (delay) {
            setTimeout(reflow, delay);
          });
          setTimeout(function () { busy = false; }, 1200);
        }
        window.addEventListener("orientationchange", onRotate);
        if (window.screen && window.screen.orientation) {
          window.screen.orientation.addEventListener("change", onRotate);
        }
      })();
    </script>
  </body>
</html>
